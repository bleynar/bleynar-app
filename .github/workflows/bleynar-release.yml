name: Attach signed Bleynar APK
run-name: Bleynar APK · ${{ github.event.client_payload.request_id }}

on:
  repository_dispatch:
    types: [bleynar-release-apk]

permissions: {}

jobs:
  attach:
    if: github.repository_id == '1467567653'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: bleynar-apk-${{ github.event.client_payload.release_id }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify signature and attach APK to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/release_apk.py attach
